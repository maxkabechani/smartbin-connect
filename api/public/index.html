<!doctype html><html><head><meta name="viewport" content="width=device-width"><title>SmartBin Connect</title><style>body{font-family:Arial;margin:0;background:#f4f7fa;color:#163a5f}header{background:#163a5f;color:#fff;padding:24px 6vw}main{padding:24px 6vw;max-width:1100px;margin:auto}.box,.card{background:#fff;border:1px solid #d9e2ea;border-radius:12px;padding:18px;margin:12px 0}input{padding:10px;margin:4px;border:1px solid #bac8d4;border-radius:6px}button{background:#2e75b6;color:white;border:0;padding:10px 14px;border-radius:6px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.fill{height:14px;background:#e7edf2;border-radius:8px;overflow:hidden}.bar{height:100%;background:#2e8b57}.high .bar{background:#e4a11b}.urgent .bar{background:#c0392b}.muted{color:#607080;font-size:14px}.hidden{display:none}</style></head><body><header><h1>SmartBin Connect</h1><div>Customer bin monitoring and collection dispatch</div></header><main><section id="auth" class="box"><h2>Customer account</h2><input id="name" placeholder="Name"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><br><button onclick="signup()">Create account</button> <button onclick="login()">Log in</button><p id="authmsg" class="muted"></p></section><section id="app" class="hidden"><div class="box"><button onclick="logout()">Log out</button><h2>Link a bin</h2><input id="binid" placeholder="BIN-01"><input id="claim" placeholder="Claim code"><button onclick="claimBin()">Link bin</button><p id="claimmsg" class="muted"></p></div><h2>My bins</h2><div id="bins" class="grid"></div><h2>Collection requests</h2><div id="dispatch" class="grid"></div></section></main><script>const $=id=>document.getElementById(id);async function call(url,opts={}){opts.credentials='include';opts.headers={'content-type':'application/json',...(opts.headers||{})};return fetch(url,opts)}async function signup(){let r=await call('/api/auth/sign-up/email',{method:'POST',body:JSON.stringify({name:$('name').value,email:$('email').value,password:$('password').value})});$('authmsg').textContent=r.ok?'Account created. You are signed in.':await r.text();init()}async function login(){let r=await call('/api/auth/sign-in/email',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});$('authmsg').textContent=r.ok?'Signed in.':await r.text();init()}async function logout(){await call('/api/auth/sign-out',{method:'POST'});init()}async function claimBin(){let r=await call('/api/bins/claim',{method:'POST',body:JSON.stringify({bin_id:$('binid').value,claim_code:$('claim').value})});$('claimmsg').textContent=r.ok?'Bin linked.':await r.text();refresh()}async function init(){let r=await call('/api/me');let logged=r.ok; $('auth').classList.toggle('hidden',logged);$('app').classList.toggle('hidden',!logged);if(logged)refresh()}async function refresh(){let b=await(await call('/api/bins')).json();$('bins').innerHTML=b.length?b.map(x=>`<div class="card ${x.priority}"><h3>${x.bin_id}</h3><div class="fill"><div class="bar" style="width:${x.fill_level}%"></div></div><h2>${x.fill_level.toFixed(1)}%</h2><div class="muted">Priority: <b>${x.priority}</b></div><div class="muted">Wi-Fi RSSI: ${x.wifi_rssi} dBm</div></div>`).join(''):'<p>No linked bins yet.</p>';let d=await(await call('/api/dispatch')).json();$('dispatch').innerHTML=d.length?d.map(x=>`<div class="card ${x.priority}"><h3>${x.bin_id} · ${x.priority}</h3><div class="muted">${x.reason}</div><button onclick="closeTask(${x.id})">Mark collected</button></div>`).join(''):'<p>No open collection requests.</p>'}async function closeTask(id){await call('/api/dispatch/'+id+'/close',{method:'POST'});refresh()}init();setInterval(()=>{if(!$('app').classList.contains('hidden'))refresh()},10000)</script></body></html>
